name: Release

# When a release is published on GitHub, run the tests, build plumb.skill and
# attach it to the release so people can install Plumb in one click.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build plumb.skill
        run: python tools/build_skill.py
      - name: Attach to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/plumb.skill --clobber
        env:
          GH_TOKEN: ${{ github.token }}
